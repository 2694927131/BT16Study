section_outline:
  s02_objectives:
    min_words: 100
    must_contain:
      - "Unicast"
      - "Broadcast"
      - "LC3"
      - "Auracast"
    template: |
      读完本节，你能：
      - 用一句话说清 LE Audio 与 Classic Audio（A2DP/HFP）的本质区别
      - 列出 LE Audio 的 5 类规范集（BAP/CAP/TMAP/HAP/GMAP）及各自定位
      - 区分 Unicast 与 Broadcast 的协议路径（CIS vs BIS）与典型用例
      - 说出 AOSP 中 LE Audio 的 4 层代码组织（Framework → Service → JNI → BTA）
      - 指出车机场景下 LE Audio 的 3 个最常见用例

  s03_prereq:
    min_words: 80
    must_link: ["00.1", "00.3", "08.2"]

  s04_scene:
    min_words: 250
    must_mention:
      - "无线耳机"
      - "公共场所广播"
      - "助听器"
    template_hint: |
      建议故事：车主停车后通过 Auracast 把车载导航音同时广播给副驾的耳机和
      后排两位戴助听器的乘客 —— 一条链路四个听众，且每路声音都准时同步、
      不抢车机主声道。展开讲：① 这种"一发多收"在 Classic 时代为什么做不到；
      ② Unicast / Broadcast 各自承担什么角色；③ 助听器走 HAP 与普通耳机走 TMAP
      的差别。

  s05_protocol:
    min_words: 800
    must_contain:
      - "LE Audio"
      - "Unicast"
      - "Broadcast"
      - "CIS"
      - "BIS"
      - "LC3"
      - "BAP"
      - "TMAP"
      - "HAP"
      - "Auracast"
      - "Bluetooth Core Spec Vol 6"
    must_have_hexdump: false

  s06_call_chain:
    min_layers: 5
    format: |
      App:        startUsingLeAudio(...) / startBroadcast(...)
      Framework:  BluetoothLeAudio.java / BluetoothLeBroadcast.java
      Service:    LeAudioService.java（Unicast） / LeAudioBroadcastService（Broadcast）
      JNI:        LeAudioNativeInterface.java / LeAudioBroadcasterNativeInterface.java
      BTA:        system/bta/le_audio/client.cc（Unicast） / broadcaster/broadcaster.cc（Broadcast）
      HCI/ISO:    LE Set CIG Parameters / LE Create BIG / ISO Data Path

  s07_source_guide:
    min_refs: 8
    all_from_allowed_refs: true
    suggested_order:
      - "BluetoothLeAudio.java:68（Framework Unicast API 入口类）"
      - "BluetoothLeBroadcast.java:60（Framework Broadcast API 入口类）"
      - "LeAudioService.java:114（Java Service 类声明）"
      - "LeAudioService.java:873（connect 入口）"
      - "LeAudioStateMachine.java:136/249/466（三状态状态机）"
      - "client.cc:274（LeAudioClientImpl 类，Unicast 核心）"
      - "client.cc:7749（LeAudioClient::Initialize Native 入口）"
      - "broadcaster.cc:108（LeAudioBroadcasterImpl 类，Broadcast 核心）"
      - "broadcaster.cc:1396（LeAudioBroadcaster::Initialize Native 入口）"

  s08_simplified_code:
    min_snippets: 2
    required_snippets:
      - "snippet_le_audio_initialize"
      - "snippet_le_audio_broadcaster_init"

  s09_mermaid:
    min_diagrams: 2
    required_templates:
      - "T-ARCH-6"
      - "T-FLOW-DECISION"

  s10_measured:
    required_fields:
      - "时延（Unicast 端到端延迟，典型/p95，对比 A2DP）"
      - "成功率（CIS 建立成功率，含弱信号场景）"
      - "重试次数（CIS 重连重试次数统计）"
    data_source_hint: "可从 dumpsys bluetooth_manager metrics、BQR、或 statsd LeAudio 上报获取"

  s11_debug:
    must_include_commands:
      - "adb logcat -s bt_le_audio:V LeAudioService:V LeAudioStateMachine:V"
      - "adb shell dumpsys bluetooth_manager | grep -A 50 LeAudio"
      - "btsnoop + Wireshark filter: bthci_iso || btatt"
      - "adb shell device_config list bluetooth | grep leaudio"
    car_integration_points:
      - "OEM 通常通过 sysprop bluetooth.profile.bap.unicast.client.enabled / bluetooth.profile.bap.broadcast.* 开关 LE Audio 子集"
      - "车机若想做 Broadcast 源（向副驾耳机/助听器广播），需要确认 Controller 支持 BIG（BLE 5.2+ Isochronous Channel）"
      - "Codec offload：通过 audio HAL leAudioOffload 接口，未支持时回退 Software LC3（CPU 占用 ~3%）"

  s12_faq_homework:
    min_faqs: 4
    min_quizzes: 3
    min_homeworks: 2
    suggested_faqs:
      - "LE Audio 会替代 A2DP/HFP 吗？过渡期车机如何兼容？"
      - "Unicast 和 Broadcast 能不能同时跑？需要什么 Controller 能力？"
      - "Auracast 和普通 BLE 广播是同一个东西吗？"
      - "TMAP / HAP / GMAP 这三个 'AP' 到底有什么区别？车机要支持哪个？"
    suggested_homeworks:
      - "用 dumpsys bluetooth_manager 找出当前设备启用了哪些 LE Audio 子集，对照 sysprops 验证"
      - "用 btsnoop 抓一次 LE Audio Unicast 连接，在 Wireshark 中标出 PACS Discover → ASCS Configure → CIS Established 三个里程碑"

known_pitfalls:
  - description: "不要把 LE Audio 当成 A2DP 的 LE 版"
    detail: "LE Audio 重新设计了协议栈：用 LC3 取代 SBC、用 CIS/BIS 取代 L2CAP+AVDTP、用 BAP/ASCS 取代 A2DP/AVDTP；它是 BLE 5.2 引入的全新音频架构"

  - description: "不要把 Auracast 和 BLE Mesh 混为一谈"
    detail: "Auracast 是 LE Audio Broadcast 的市场品牌名（由 Bluetooth SIG 推广），走 BIS/PA；BLE Mesh 是另一个完全独立的网络层协议（走 GAP Advertising + GATT），两者无关"

  - description: "不要假设所有 BLE 5.2+ 设备都支持 LE Audio"
    detail: "LE Audio 需要 Controller 支持 Isochronous Channels（CIS/BIS）；早期 BLE 5.2 芯片可能只支持 LE 2M PHY 但不含 ISO，要用 LE Read Local Supported Commands 验证"

  - description: "Unicast 和 Broadcast 是两套独立 Service"
    detail: "LeAudioService 只管 Unicast；Broadcast 是 LeAudioBroadcastService（Native 端为 LeAudioBroadcasterImpl）；两者的 GATT 服务、状态机、HAL 路径完全独立，调试时不要混查日志"

  - description: "不要用 'Master/Slave' 描述 LE Audio 角色"
    detail: "LE Audio 中应使用 Central（车机/手机）/ Peripheral（耳机/助听器）；Broadcast 中应使用 Source（发射端）/ Sink（接收端）"

