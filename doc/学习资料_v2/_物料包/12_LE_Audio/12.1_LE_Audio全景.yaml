code_snippets:
  - id: "snippet_le_audio_initialize"
    source: "system/bta/le_audio/client.cc:7749-7758"
    language: "cpp"
    code: |
      // L7749
      void LeAudioClient::Initialize(
              bluetooth::le_audio::LeAudioClientCallbacks* callbacks_, base::Closure initCb,
              base::Callback<bool()> hal_2_1_verifier,
              const std::vector<bluetooth::le_audio::btle_audio_codec_config_t>& offloading_preference) {
        std::scoped_lock<std::mutex> lock(instance_mutex);
        if (instance) {
          log::error("Already initialized");
          return;
        }
        // ... 创建 LeAudioClientImpl 单例，注册回调、初始化 codec、加载持久化的 group ...
      }
    annotation: |
      LE Audio Unicast 的 Native 入口。LeAudioService.java 通过 JNI 调用进入此处。
      `offloading_preference` 参数告诉 Stack 哪些 codec 配置允许 offload 到 Controller（节省功耗），
      其他配置回退到 Software 路径（CPU 跑 LC3 编解码）。
      这里用 `std::scoped_lock` 加锁是 RAII —— 等价于 Java 的 `synchronized` 块。

  - id: "snippet_le_audio_broadcaster_init"
    source: "system/bta/le_audio/broadcaster/broadcaster.cc:1396-1400"
    language: "cpp"
    code: |
      // L1396
      void LeAudioBroadcaster::Initialize(bluetooth::le_audio::LeAudioBroadcasterCallbacks* callbacks,
                                          base::Callback<bool()> hal_2_1_verifier) {
        // 初始化 LeAudioBroadcasterImpl 单例（与 Unicast 完全独立的另一条链路）
      }
    annotation: |
      LE Audio Broadcast 的 Native 入口。注意 Broadcast 和 Unicast 是 **完全独立** 的两套
      代码路径：Unicast 走 client.cc + state_machine.cc + ASE/ASCS GATT 协议；
      Broadcast 走 broadcaster/*.cc + BIS/PA 协议。理解这一点对后续 12.3 (CIS/BIS) 至关重要。

