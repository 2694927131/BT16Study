    min_homeworks: 2
    suggested_faqs:
      - "LC3 和 SBC 的核心区别是什么？为什么 LE Audio 用 LC3 而不是继续用 SBC？"
      - "Software 路径和 Offload 路径的切换对用户透明吗？切换时会有声音中断吗？"
      - "为什么 JSON 配置文件在 APEX 路径下？OEM 如何定制 LC3 参数？"
      - "BidirectionalPair 是什么结构？为什么 LE Audio 需要双向配置？"
    suggested_homeworks:
      - "用 `adb shell getprop ro.bluetooth.leaudio_offload.supported` 确认设备是否支持 Offload；再用 `adb logcat -s bt_le_audio:V` 抓一次 LE Audio 连接日志，找到 CodecManager 初始化时打印的 CodecLocation"
      - "在 AOSP 源码中找到 `audio_set_configurations.json` 文件（路径提示：在 APEX 目录或 `system/bt/le_audio/`），读取一条 LC3 配置条目，对照 CodecConfigSetting 结构体解释各字段含义"

known_pitfalls:
  - description: "不要把 LC3 的帧时长和 CIS 的 ISO Interval 混为一谈"
    detail: |
      LC3 帧时长（7.5ms 或 10ms）是编解码的时间粒度，决定编码延迟；
      CIS 的 ISO Interval 是蓝牙等时流的调度间隔，通常是帧时长的整数倍。
      帧时长 10ms + ISO Interval 10ms 是最常见的低延迟配置，详见 12.3。

  - description: "不要假设所有 LE Audio 设备都支持 Offload"
    detail: |
      Offload 需要 Controller 和 Audio HAL 同时支持（LeAudioHalVerifier::SupportsLeAudioHardwareOffload）。
      车机 OEM 如果芯片的 Audio HAL 尚未实现 LE Audio Offload 接口，GetCodecLocation 会返回 HOST，
      LC3 就在 CPU 上跑，功耗上升约 3%（单通道）。

  - description: "不要直接 new CodecInterface，要用 CreateInstance 工厂方法"
    detail: |
      `CodecInterface::CreateInstance(LeAudioCodecIdLc3)` 返回 unique_ptr，
      确保生命周期安全（RAII）。直接构造 `CodecInterface obj(...)` 没有问题但不符合项目惯例，
      且与 PIMPL 的 impl 析构顺序会有微妙差异。

  - description: "LeAudioCodecIdOpus 是 Vendor Specific，不是 LC3 的变种"
    detail: |
      OPUS 在 LE Audio 中走 Vendor Specific Codec（coding_format = 0xFF，vendor_company_id = Google）。
      `leaudio_add_opus_hi_res_codec_type` flag 开启后才有效，且需要对端耳机也支持。
      不要把 OPUS 和 LC3 的 codec_id 混用。

  - description: "JSON 配置文件在 APEX 下，模拟器上路径不同"
    detail: |
      `kLeAudioSetConfigs` 定义的路径是 `/apex/com.android.bt/...`，在模拟器或 AOSP 开发构建中
      该路径可能不存在，LoadConfigurationsFromFiles 会失败并回退内置默认配置。
      真机调试时先用 `adb shell ls /apex/com.android.bt/etc/bluetooth/le_audio/` 确认文件存在。

