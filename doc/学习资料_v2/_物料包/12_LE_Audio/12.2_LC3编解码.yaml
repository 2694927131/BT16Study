section_outline:
  s02_objectives:
    min_words: 100
    must_contain:
      - "LC3"
      - "CodecInterface"
      - "CodecManager"
      - "Offload"
      - "Software"
      - "CodecLocation"
    template: |
      读完本节，你能：
      - 说出 LC3 帧的三个关键参数（采样率、帧时长、目标码率），理解它们如何影响时延与音质
      - 区分 Software 编解码路径（CodecInterface::Encode/Decode）与 Offload 路径（Controller/DSP 自行编解码）
      - 理解 CodecManager::GetCodecLocation() 的选路逻辑与返回值（HOST / ADSP）
      - 找到 AOSP 中 LC3 配置文件的加载入口（audio_set_configurations.json + LoadConfigurationsFromFiles）
      - 解释 LeAudioCodecIdLc3 与 LeAudioCodecIdOpus 的结构差异，理解 Vendor Specific Codec 的扩展方式

  s03_prereq:
    min_words: 80
    must_link: ["12.1", "16.1"]

  s04_scene:
    min_words: 200
    must_mention:
      - "无线耳机"
      - "Offload"
      - "Software"
    template_hint: |
      建议场景：同一款车机 + 耳机，连接低端耳机（不支持 LC3 Offload）时
      CodecManager 返回 HOST，CPU 跑 LC3 编码，你能在 logcat 看到
      "LeAudioCodecManagerImpl: offload disabled"；换一副支持 Offload 的
      耳机后返回 ADSP，CPU 占用骤降。通过这个对比展开讲 Software vs Offload 路径的差异。

  s05_protocol:
    min_words: 700
    must_contain:
      - "LC3"
      - "帧时长"
      - "采样率"
      - "码率"
      - "CodecInterface"
      - "CodecManager"
      - "CodecLocation"
      - "Offload"
      - "Software"
      - "LeAudioCodecIdLc3"
      - "BidirectionalPair"
      - "AudioSetConfiguration"
    must_have_hexdump: false
    note: |
      重点讲 LC3 的三个关键参数（采样率 8/16/24/32/44.1/48kHz、帧时长 7.5ms/10ms、
      目标码率 16~320kbps）如何在 CodecConfigSetting 中表示，以及
      LoadConfigurationsFromFiles 从 JSON 文件加载这些参数的流程。
      不需要讲 LC3 算法内部（那属于 Bluetooth SIG 标准文档范畴）。

  s06_call_chain:
    min_layers: 5
    format: |
      LeAudioClient（Unicast）/ LeAudioBroadcaster（Broadcast）:
        → 初始化时透传 offloading_preference
      CodecManager::Start(offloading_preference):
        → codec_manager_impl::Start() 探测 HAL 支持
        → GetCodecLocation() 返回 HOST 或 ADSP
      路径 A — Software（CodecLocation::HOST）:
        → CodecInterface::CreateInstance(LeAudioCodecIdLc3)
        → InitEncoder(pcm_config, codec_config)
        → Encode(pcm_data, stride, out_size) → LC3 帧
        → 通过 ISO Data Path 送入 Controller
      路径 B — Offload（CodecLocation::ADSP）:
        → BluetoothAudioClientInterface::StartSession()（见 16.1）
        → UpdateAudioConfig(AudioConfiguration) → Controller/DSP 自行编码
        → PCM 数据不经 CPU，直接在 DSP 上编成 LC3 帧

