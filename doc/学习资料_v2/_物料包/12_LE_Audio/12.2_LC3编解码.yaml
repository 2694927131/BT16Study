      - "codec_manager.cc:112（codec_manager_impl 内部实现）"
      - "codec_manager.cc:1457/1469（Start / GetCodecLocation）"
      - "le_audio_set_configuration_provider_json.cc:54（JSON 配置文件路径）"
      - "le_audio_set_configuration_provider_json.cc:387（LoadConfigurationsFromFiles）"
      - "BluetoothLeAudio.java:1342（Framework getCodecStatus API）"

