      - "btm_iso_api_types.h:105/135（cis_establish_params / big_create_params）"
      - "btm_iso_api.h:52（IsoManager 类声明）"
      - "btm_iso_api.h:69/78（RegisterCigCallbacks / RegisterBigCallbacks）"
      - "btm_iso_api.h:93/116/168（CreateCig / EstablishCis / CreateBig）"
      - "state_machine.h:32（LeAudioGroupStateMachine 接口）"
      - "state_machine.h:52/58/71/74（StartStream / ConfigureStream / ProcessHciNotif 系列）"
      - "state_machine.cc:218（StartStream 实现：CIG 建立起点）"
      - "state_machine.cc:653/1150/796（ProcessHciNotifOnCigCreate / ProcessHciNotifCisEstablished / ProcessHciNotifSetupIsoDataPath）"
