  s11_debug:
    must_include_commands:
      - "adb logcat -s bt_le_audio:V bt_le_audio_state_machine:V"
      - "adb shell dumpsys bluetooth_manager | grep -A 30 'CIG\\|CIS\\|BIG\\|BIS'"
      - "btsnoop + Wireshark filter: bthci_cmd || bthci_evt || bthci_iso"
      - "adb shell device_config list bluetooth | grep leaudio"
    car_integration_points:
      - "CIG 的 max_trans_lat 参数由 audio_set_configurations.json 中的 QoS 配置决定；OEM 若调小此值可降低延迟但会提高重传率，需在 btsnoop 中监测 CIS 断开率"
      - "车机作为 Central（发起方），需要在 Controller 中为每个 CIS 预留 TX/RX buffer；多设备同时 Unicast 时，Controller 的 CIS 数量上限（通常 8-16 个）是重要限制"
      - "Broadcast（BIG）不需要配对，但车机要做 Broadcast Source 时必须确认 Controller 支持 BIG（BLE 5.2 Isochronous Channels）"
      - "ISO Data Path 建立后，音频数据不走 ACL，走独立的 ISO 通道（更低时延，不受 ACL 队列堵塞影响）"

  s12_faq_homework:
    min_faqs: 4
    min_quizzes: 3
    min_homeworks: 2
    suggested_faqs:
      - "CIS 和 ACL 有什么区别？为什么音频不走 ACL 而要用 CIS？"
      - "Presentation Delay 是什么？它和 max_transport_latency 有什么关系？"
      - "BIS 为什么不需要配对就能接收？安全性如何保障？"
      - "CIS 建立失败最常见的原因是什么？如何在 logcat 中快速定位？"
    suggested_homeworks:
      - "用 btsnoop 抓一次 LE Audio Unicast 连接，在 Wireshark 中找到 HCI_LE_SET_CIG_PARAMS 命令和对应的 Command Complete Event，记录 CIG ID 和各 CIS Handle 的值"
      - "在 logcat 中搜 `StartStream` 和 `CigCreate` 日志，统计从 StartStream 触发到 `ProcessHciNotifSetupIsoDataPath` 完成的时间间隔（即 CIS 建立总时延）"

known_pitfalls:
  - description: "不要把 CIG 和 ACL Connection Handle 混淆"
    detail: |
      CIG 有自己的 conn_handle（由 HCI_LE_CREATE_CIS 返回），
      与 ACL 的 conn_handle 是不同的命名空间。
      调试时 `ProcessHciNotifCisEstablished` 中的 cis_conn_hdl 是 CIS 专属句柄，
      不能用来发 ACL 数据。混用会导致 HCI 命令失败。

  - description: "max_transport_latency 不等于端到端音频延迟"
    detail: |
      max_trans_lat 是 BLE 物理层的传输延迟上限（Controller 级别），
      端到端延迟还需加上：编解码延迟（LC3 帧时长）+ Presentation Delay（接收端缓冲等待）。
      典型端到端延迟 = 帧时长(10ms) + max_trans_lat(10ms) + Presentation Delay(10-40ms)
      ≈ 30-60ms，远高于 max_trans_lat 本身。详见 16.4。

  - description: "CIS 建立是异步多步的，不要期望 StartStream 同步返回音频可用"
    detail: |
      StartStream() 只是触发 CigCreate，整个流程经历
      CigCreate → CisEstablish → SetupIsoDataPath 三个异步步骤，
      每步都需要等 HCI Event。从 StartStream 到音频真正可播，
      通常需要 200-500ms。LeAudioClient 通过 StatusReportCb 通知上层流已就绪。

  - description: "Broadcast BIS 的安全性依赖 Broadcast Code，不要以为无配对就意味着无加密"
    detail: |
      Auracast 广播可设置 Broadcast Code（128-bit 密钥）对 BIG 加密；
      接收端需要通过带外方式（如 QR 码、NFC）获取 Broadcast Code 才能解密。
      如果没有 Broadcast Code，BIG 是明文传输——公共场所广播（如车站音频）通常不加密，
      私密场景（如会议室）应设置 Broadcast Code。

  - description: "不要用 LeAudioGroupStateMachine 直接处理 Broadcast 事件"
    detail: |
      LeAudioGroupStateMachine 只管理 Unicast（CIG/CIS）；
      Broadcast（BIG/BIS）由 BroadcastStateMachine 独立管理。
      两套状态机的 HCI 回调注册路径完全不同（RegisterCigCallbacks vs RegisterBigCallbacks），
      调试时不要混查日志。

