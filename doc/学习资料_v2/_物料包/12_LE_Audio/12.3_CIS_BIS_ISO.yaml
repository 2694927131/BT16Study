section_outline:
  s02_objectives:
    min_words: 100
    must_contain:
      - "CIG"
      - "CIS"
      - "BIG"
      - "BIS"
      - "IsoManager"
      - "ISO Data Path"
      - "Presentation Delay"
    template: |
      读完本节，你能：
      - 画出 Unicast CIS 建立的 7 步序列（ConfigureASE → CigCreate → EstablishCis → SetupIsoDataPath）
      - 区分 CIG/CIS（Unicast，点对点，有 ACK）与 BIG/BIS（Broadcast，一发多收，无 ACK）
      - 找到 AOSP 中 IsoManager 的 4 个核心方法（CreateCig / EstablishCis / SetupIsoDataPath / CreateBig）
      - 解释 Presentation Delay 的含义及其与 max_transport_latency 的区别
      - 理解 BroadcastStateMachine 的 7 个状态及其转换触发条件

  s03_prereq:
    min_words: 80
    must_link: ["12.1", "12.2", "03.4"]

  s04_scene:
    min_words: 200
    must_mention:
      - "CIS"
      - "BIS"
      - "车机"
    template_hint: |
      建议两个场景对比：
      ① Unicast：车主手机通过 CIS 与车机耳机通信，丢包会重传（有 RTN），
        音频有保障但延迟略高；
      ② Broadcast：车机通过 BIS 向副驾耳机+后排助听器同时广播，无需配对，
        但丢包不重传（无 RTN），靠 FEC 容错。

  s05_protocol:
    min_words: 800
    must_contain:
      - "CIG"
      - "CIS"
      - "BIG"
      - "BIS"
      - "IsoManager"
      - "HCI_LE_SET_CIG_PARAMS"
      - "HCI_LE_CREATE_CIS"
      - "HCI_LE_CREATE_BIG"
      - "HCI_LE_SETUP_ISO_DATA_PATH"
      - "SDU"
      - "Presentation Delay"
      - "LeAudioGroupStateMachine"
    must_have_hexdump: false
    note: |
      重点讲 CIS 建立的三段式流程（ASE/GATT → HCI/CIG → ISO DataPath），
      以及 Unicast 与 Broadcast 两条路各自经过哪些 IsoManager API。
      max_trans_lat 与 Presentation Delay 的区别要单独一段解释清楚。

  s06_call_chain:
    min_layers: 5
    format: |
      Unicast 建流调用链：
        LeAudioClientImpl: StartStream(group, context_type)
        LeAudioGroupStateMachine: StartStream() → CigCreate(group)
        IsoManager::GetInstance()->CreateCig(cig_create_params)
        HCI层: HCI_LE_SET_CIG_PARAMS → Controller
        [Controller 回调 cig_create_cmpl_evt]
        IsoManager → LeAudioStateMachineHciCallbacksImpl::OnCigEvent()
        ProcessHciNotifOnCigCreate() → IsoManager::EstablishCis()
        → HCI_LE_CREATE_CIS → [Controller 建立 CIS]
        ProcessHciNotifCisEstablished() → SetupIsoDataPath()
        → HCI_LE_SETUP_ISO_DATA_PATH → 数据通路打通

      Broadcast 建流调用链（简化）：
        LeAudioBroadcasterImpl: StartBroadcast()
        BroadcastStateMachine::CreateBig()
        IsoManager::GetInstance()->CreateBig(big_create_params)
        HCI层: HCI_LE_CREATE_BIG → Controller
        [Controller 回调 big_create_cmpl_evt]
        → SetupIsoDataPath() → BIS 数据通路打通

