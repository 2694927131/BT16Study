      - "BluetoothCsipSetCoordinator.java:64（Framework API 类）"
      - "BluetoothCsipSetCoordinator.java:285/320（lockGroup / unlockGroup）"
      - "VolumeControlService.java:79（VCP Service 类声明）"
      - "VolumeControlService.java:583/553（setDeviceVolume / setVolumeOffset）"
      - "BluetoothVolumeControl.java:68/704（Framework API：setDeviceVolume）"
      - "McpService.java:40（MCP Service 入口）"
      - "MediaControlProfile.java:65/399（MediaControlProfile + onMediaControlRequest）"
      - "TbsService.java:40（TBS Service 入口）"
      - "TbsService.java:118/215（setDeviceAuthorized / callAdded）"

  s08_simplified_code:
    min_snippets: 2
