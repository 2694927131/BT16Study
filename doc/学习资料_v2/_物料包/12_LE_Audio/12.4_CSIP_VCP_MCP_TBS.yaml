# 适配模型档位：中（DeepSeek V4 / GLM 5.1 / Sonnet 4.6 / Gemini 2.5 Pro）
# ============================================================================
# 本节覆盖 LE Audio 体系中的四个伴随 Profile：
#   CSIP — 协调集（双耳同步）
#   VCP  — 音量控制
#   MCP  — 媒体控制（播放/暂停/上下曲）
#   TBS  — 电话承载服务（来电/接听/挂断）
# 这四个 Profile 不传输音频数据，但控制"谁在播、音量多大、播什么、接不接电话"。
# ============================================================================

