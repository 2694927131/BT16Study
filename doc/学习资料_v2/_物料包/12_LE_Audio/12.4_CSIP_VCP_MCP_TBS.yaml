section_outline:
  s02_objectives:
    min_words: 100
    must_contain:
      - "CSIP"
      - "VCP"
      - "MCP"
      - "TBS"
      - "lockGroup"
      - "setDeviceVolume"
    template: |
      读完本节，你能：
      - 用一句话说清 CSIP / VCP / MCP / TBS 各自负责什么，以及与 BAP 的关系
      - 画出从 App 调用 setDeviceVolume 到 VCP Native 命令下发的完整调用链（5 层）
      - 理解 CSIP lockGroup / unlockGroup 的用途与使用时机
      - 区分 VCS（绝对音量）与 VOCS（偏移音量）的应用场景
      - 找到 MCP 和 TBS 的 Java Service 入口，理解媒体控制与电话控制如何通过 GATT 下发命令

  s03_prereq:
    min_words: 80
    must_link: ["12.1", "12.3", "08.2"]

  s04_scene:
    min_words: 200
    must_mention:
      - "双耳"
      - "音量"
      - "来电"
    template_hint: |
      建议场景：张先生正用 LE Audio 双耳机（左右耳各一台，CSIP 协调集）
      在车里听音乐（MCP），突然来了一个电话（TBS）：
      ① TBS 触发来电通知 → 车机响铃；
      ② 用户接听 → MCP 暂停音乐；
      ③ 通话结束 → MCP 恢复播放；
      ④ 用户觉得音量太大 → App 调 setDeviceVolume(isGroupOp=true) →
         VCP + CSIP 协调，同时更新左右耳音量。

  s05_protocol:
    min_words: 700
    must_contain:
      - "CSIP"
      - "VCP"
      - "MCP"
      - "TBS"
      - "VOCS"
      - "SIRK"
      - "lockGroup"
      - "setDeviceVolume"
      - "isGroupOp"
      - "LeAudioDeviceGroup"
      - "MediaControlProfile"
    must_have_hexdump: false
    note: |
      四个 Profile 各用一段讲清：
      CSIP - SIRK + lockGroup 的核心机制；
      VCP - VCS 绝对音量 vs VOCS 偏移，isGroupOp 与 CSIP 的协作；
      MCP - GMCS（Generic MCS）与设备注册，onMediaControlRequest 事件流；
      TBS - GTBS（Generic TBS）与 setDeviceAuthorized 授权，callAdded 通知流。

  s06_call_chain:
    min_layers: 5
    format: |
      VCP setDeviceVolume（Group 模式）调用链：
        App: mBluetoothVolumeControl.setDeviceVolume(device, volume, isGroupOperation=true)
        Framework: BluetoothVolumeControl.java:704 → IBluetoothVolumeControl.setDeviceVolume()
        Service: VolumeControlService.java:583 → CsipSetCoordinatorService.getGroupId()
        Service: mNativeInterface.setGroupVolume(groupId, volume)
        JNI → Native: VolumeControlNativeInterface → BTA VolumeControl → HCI GATT Write

      CSIP lockGroup 调用链：
        App: mBluetoothCsip.lockGroup(groupId, executor, callback)
        Framework: BluetoothCsipSetCoordinator.java:285
        Service: CsipSetCoordinatorService → mNativeInterface.groupLockSet()
        JNI → Native: BTA CSIP → GATT Write（CSIS Lock Characteristic）

  s07_source_guide:
    min_refs: 8
    all_from_allowed_refs: true
    suggested_order:
      - "device_groups.h:50（LeAudioDeviceGroup：CSIP 在 BTA 层的数据结构）"
