      - "T-ARCH-MODULE"
      - "T-SEQ-5"

  s10_measured:
    required_fields:
      - "VCP 音量指令到达耳机生效时延（从 setDeviceVolume 到耳机实际改变音量）"
      - "CSIP lockGroup 到 unlockGroup 典型时长（批量操作窗口）"
      - "TBS 来电通知时延（从手机来电到 callAdded 触发耳机响铃）"
    data_source_hint: |
      - btsnoop + Wireshark 过滤 GATT Write 到对应 Characteristic UUID
      - adb logcat -s VolumeControlService:V CsipSetCoordinatorService:V TbsService:V

  s11_debug:
    must_include_commands:
      - "adb logcat -s VolumeControlService:V CsipSetCoordinatorService:V McpService:V TbsService:V"
      - "adb shell dumpsys bluetooth_manager | grep -A 20 'VolumeControl\\|CSIP'"
      - "btsnoop + Wireshark filter: btatt && (btatt.opcode == 0x12 || btatt.opcode == 0x52)"
      - "adb shell device_config list bluetooth | grep leaudio_multiple_vocs"
    car_integration_points:
      - "车机通常作为 MCP Client（控制手机媒体）而非 MCP Server；如果车机有本地媒体播放器也可以实现 GMCS Server，让耳机控制车机媒体"
      - "TBS 授权（setDeviceAuthorized）默认只授权已配对设备——如果新耳机连上来但 TBS 未授权，来电铃声不会路由到耳机，需排查授权逻辑"
      - "VOCS（多音量偏移实例）由 `leaudio_multiple_vocs_instances_api` flag 控制；车机多扬声器区域场景可用 VOCS 独立控制每个扬声器的音量偏移"
      - "CSIP 的 SIRK 是设备出厂时烧录的固定密钥，用于识别同一协调集的设备；如果双耳耳机的 SIRK 不一致（固件 bug），CSIP getGroupId 会返回不同 groupId，导致 isGroupOp 失效"

  s12_faq_homework:
    min_faqs: 4
    min_quizzes: 3
    min_homeworks: 2
    suggested_faqs:
      - "CSIP 和 GATT 的 CCC（Client Characteristic Configuration）有什么关系？协调集是怎么识别的？"
      - "为什么 setDeviceVolume 需要先调用 CSIP getGroupId？直接用 GATT Write 调音量不行吗？"
      - "MCP 和 AVRCP 的媒体控制有什么区别？车机什么时候用 MCP、什么时候用 AVRCP？"
      - "TBS 和经典蓝牙 HFP 的来电流程有什么不同？能并存吗？"
    suggested_homeworks:
      - "用 btsnoop 抓一次双耳 LE Audio 设备的音量调节，在 Wireshark 中找到 VCP GATT Write 命令，确认是发给 group 还是单设备（对比 setGroupVolume vs setVolume 的 handle）"
      - "用 adb logcat -s CsipSetCoordinatorService:V 抓一次 CSIP 设备发现过程，找到 SIRK 的 log 输出，确认两台耳机的 groupId 是否一致"

known_pitfalls:
  - description: "不要把 VCP 的 VCS 和 AVRCP 的绝对音量混淆"
    detail: |
      AVRCP Absolute Volume（A2DP 场景用）与 VCP VCS（LE Audio 场景用）是两套独立的音量协议。
      如果设备同时连着 A2DP 和 LE Audio，需要分别处理。
      车机切换到 LE Audio 后应停止用 AVRCP 音量控制，改用 VCP，否则两套控制会互相干扰。

  - description: "CSIP lockGroup 不是分布式锁，只针对同一 Android 进程内的竞争"
    detail: |
      lockGroup 防止的是同一 Bluetooth App 进程内多个客户端同时操作同一协调集，
      不能防止跨 App 的并发（如车机 App + 三方音乐 App 同时调音量）。
      实际生产中 OEM 通常通过 AudioPolicyManager 的音量路由确保只有一个路径在控制音量。

  - description: "TBS 的 callAdded 只通知耳机，来电铃声路由还需 AudioPolicyManager 配合"
    detail: |
      callAdded 只是把来电信息通知给 TBS Client（耳机），
      真正让铃声从耳机扬声器出来，还需要 AudioPolicyManager 把 STREAM_RING
      路由到当前活跃的 LE Audio 输出设备。两个步骤都要就绪铃声才能响。

  - description: "MCP 控制的是 GATT 层的媒体状态，不直接控制 Android MediaPlayer"
    detail: |
      McpService 通过 MediaControlProfile 连接到 Android MediaSession，
      耳机发来的 MCP 媒体控制命令（play/pause）经由 MediaSession API 传到 App。
      如果 App 没有注册 MediaSession（如某些直播 App），MCP 控制命令会被静默忽略。

