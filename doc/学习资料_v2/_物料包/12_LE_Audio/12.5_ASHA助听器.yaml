  s04_scene:
    min_words: 200
    must_mention:
      - "助听器"
      - "ASHA"
      - "HAP"
    template_hint: |
      建议场景：老王的老式助听器只支持 ASHA（BLE + L2CAP CoC），
      他女儿的新款助听器支持 LE Audio HAP（CIS + LC3）。
      同一辆车，分别接入：
      ① 老王的助听器：走 HearingAidService，16kHz 专有编码；
      ② 女儿的助听器：走 HapClientService + LeAudioService，48kHz LC3。
      通过对比说明 ASHA 是过渡方案，HAP 是未来标准。

  s05_protocol:
    min_words: 600
