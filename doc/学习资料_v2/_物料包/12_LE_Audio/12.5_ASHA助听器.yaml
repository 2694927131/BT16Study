# 12.5 ASHA 助听器 —— 物料包（v2 ch12 P0）
# ============================================================================
# 制作者：Claude Sonnet 4.6
# 制作日期：2026-05-26
# 验证 AOSP 基线：android-16.0.0_r5
# 适配模型档位：中（DeepSeek V4 / GLM 5.1 / Sonnet 4.6 / Gemini 2.5 Pro）
# ============================================================================
# 本节覆盖 Android 的两条助听器支持路径：
#   1. ASHA（Audio Streaming for Hearing Aids）—— Google 专有协议，BLE + CoC L2CAP
#   2. HAP（Hearing Access Profile）—— 蓝牙 SIG 标准，LE Audio 体系
# 以及二者在 AOSP 中的代码组织差异和车机场景中的接入注意事项。
# ============================================================================

