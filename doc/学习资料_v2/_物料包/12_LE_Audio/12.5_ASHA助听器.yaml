      - "HearingAidImpl"
      - "OnAudioDataReady"
      - "HapClientService"
      - "BluetoothHearingAid"
      - "BluetoothHapClient"
    must_have_hexdump: false
    note: |
      ASHA 和 HAP 要各用一段讲清：
      ASHA - 发明背景（LE Audio 标准化前）、L2CAP CoC 音频通道、专有编码（16kHz）、
             JNI 回调链路、与 LE Audio 的共存策略；
      HAP - 标准化背景（Bluetooth SIG 2022）、基于 LE Audio CIS + LC3、
            HapClientService 与 LeAudioService 的关系。

  s06_call_chain:
    min_layers: 5
    format: |
      ASHA 音频流调用链：
        AudioFlinger → Audio HAL（hearing_aid_audio_hw.cc）
        HearingAidService.java（Java 层）
        HearingAidNativeInterface.java（JNI 桥）
        system/bta/hearing_aid/hearing_aid.cc:274（HearingAidImpl）
        HearingAidImpl::OnAudioDataReady(L1476) → L2CAP CoC → 助听器

      HAP 连接调用链：
        App → BluetoothHapClient.setConnectionPolicy()（Framework L579）
        HapClientService.connect(device)（L453）
        JNI → BTA HAP → GATT 发现 HARC（Hearing Aid Remote Control）服务
        → 走 LE Audio CIS 建流（见 12.3）

