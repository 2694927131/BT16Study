    template: |
      读完本节，你能：
      - 说清 ASHA（Google 专有）与 HAP（LE Audio 标准）两条助听器路径的本质区别（协议层、编解码）
      - 找到 AOSP 中 ASHA 的 4 层代码组织（Framework → Service → JNI → BTA HearingAidImpl）
      - 理解 OnAudioDataReady 在 ASHA 音频流中的角色（L2CAP CoC 发送周期）
      - 对比 HearingAidService 与 HapClientService 的功能边界
