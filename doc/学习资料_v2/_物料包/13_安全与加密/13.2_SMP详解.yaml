  - name: "unrelated_device_smp_cancellation"
    file: "flags/pairing.aconfig:95"
    default: true
    impact: "无关设备触发的 SMP 取消请求是否生效"

  - name: "ignore_le_smp_conn_when_sm_over_br_progress"
    file: "flags/pairing.aconfig:115"
    default: true
    impact: "BR 配对进行中时是否忽略 LE SMP 连接（避免双轨冲突）"

  - name: "conclude_le_pairing_immediately"
    file: "flags/pairing.aconfig:263"
    default: false
    impact: "LE 配对完成后是否立即结束（影响 CTKD 行为）"

