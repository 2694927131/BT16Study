section_outline:
  s02_objectives:
    min_words: 100
    must_contain:
      - "SMP 状态机"
      - "Association Model"
      - "LTK / IRK"
    template: |
      读完本节，你能：
      - 画出 SMP 完整状态机
      - 解释 4 种 Association Model 的选择条件
      - 区分 LTK / IRK / CSRK 的作用与持久化路径
      - 用 btsnoop 抓取并解读完整 SMP 流程

  s03_prereq:
    min_words: 80
    must_link: ["03.3", "08.2", "13.1"]

  s04_scene:
    min_words: 250
    must_mention:
      - "BLE 钥匙"
      - "数字车钥匙"
      - "首次配对"
    template_hint: |
      建议故事：用户首次拿到带 BLE 钥匙的车，下车走 5 米后车自动落锁；
      展开讲：① 钥匙与车机如何完成配对；② 后续重连时用哪个密钥；
      ③ 如果钥匙被克隆会发生什么（引出 MITM 防护）

  s05_protocol:
    min_words: 800
    must_contain:
      - "Pairing Request"
      - "Pairing Response"
      - "Phase 1"
      - "Phase 2"
      - "Phase 3"
      - "Key Distribution"
      - "Bluetooth Core Spec Vol 3 Part H"
    must_have_hexdump: true

  s06_call_chain:
    min_layers: 5
    format: |
      App: device.createBond()
      Framework: BluetoothDevice.java
      Service: AdapterService.kt
      JNI: com_android_bluetooth_btservice_AdapterService.cpp
      BTIF: system/btif/src/btif_dm.cc
      BTA: system/bta/dm/bta_dm_act.cc
      Stack/SMP: system/stack/smp/smp_api.cc:83

  s07_source_guide:
    min_refs: 8
    all_from_allowed_refs: true
    suggested_order:
      - "smp_api.cc:49（初始化入口）"
      - "smp_api.cc:83（配对入口）"
      - "smp_act.cc:283（构造 Pairing Request）"
      - "smp_act.cc:538（解析对端 Pairing Cmd）"
      - "smp_act.cc:1399（决定 Association Model）"
      - "smp_main.cc:914（状态机变迁）"
      - "smp_main.cc:1014（状态名调试）"
      - "smp_int.h:379-412（公共声明速查）"

  s08_simplified_code:
    min_snippets: 2
    required_snippets:
      - "snippet_smp_pair_entry"
      - "snippet_smp_state_machine"

  s09_mermaid:
    min_diagrams: 2
    required_templates:
      - "T-SEQ-5"
      - "T-STATE-2"

  s10_measured:
    required_fields:
      - "时延（首次配对 Phase 1-3 总耗时，典型/p95）"
      - "成功率（车机 vs 不同手机品牌兼容性）"
      - "重试次数（弱信号下的统计）"
    data_source_hint: "可从 dumpsys bluetooth_manager metrics 或 BQR 上报获取"

  s11_debug:
    must_include_commands:
      - "adb logcat -s bt_gd_smp:V bt_gd_security:V"
      - "adb shell dumpsys bluetooth_manager | grep -A 30 SMP"
      - "btsnoop + Wireshark filter: btsmp"
      - "adb shell device_config get bluetooth conclude_le_pairing_immediately"
    car_integration_points:
      - "OEM 通常定制 IO Capability（车机多为 DisplayYesNo）"
      - "BLE 钥匙厂商常通过 CTKD 同时建立 BR/EDR 加密"
      - "首次配对后 LTK 持久化路径：/data/misc/bluedroid/bt_config.conf"

  s12_faq_homework:
    min_faqs: 4
    min_quizzes: 3
    min_homeworks: 2
    suggested_faqs:
      - "为什么我的 BLE 钥匙重连不需要再配对？（LTK 持久化）"
      - "Just Works 是否真的不安全？（短距离威胁模型 + CCC 要求 NC）"
      - "iOS / Android 的 IO Capability 差异导致的兼容问题"
      - "LE Secure Connections vs Legacy Pairing 如何区分"
    suggested_homeworks:
      - "用 btsnoop 抓一次完整的 BLE 配对，在 Wireshark 标出 Phase 1/2/3"
      - "改 conclude_le_pairing_immediately flag 观察行为变化"

known_pitfalls:
  - description: "不要把 SSP 和 SMP 混为一谈"
    detail: "SSP 是 Classic（BR/EDR）配对，SMP 是 LE 配对，协议完全不同"

  - description: "不要写 'Master/Slave'"
    detail: "BLE 5.3+ 强制使用 Central/Peripheral"

  - description: "smp_cb 是全局单例"
    detail: "AOSP 当前实现 SMP 一次只能跑一对配对，并发请求会返回 SMP_BUSY"

  - description: "LTK 和 Link Key 不是同一个东西"
    detail: "LTK = LE Long Term Key；Link Key = Classic 链路密钥；CTKD 才是把两者派生关联起来"

