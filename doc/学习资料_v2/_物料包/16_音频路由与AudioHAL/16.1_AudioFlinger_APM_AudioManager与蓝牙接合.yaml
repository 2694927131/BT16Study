      - "蓝牙电话"
      - "A2DP"
    template_hint: |
      故事建议：车主正在用蓝牙耳机听音乐（A2DP 路由激活），
      这时手机来电话——车机需要把 Active Device 从 A2DP 切换到 HFP，
      同时 AudioPolicyManager 把 STREAM_MUSIC 哑音、把 SCO 打开。
      用这个故事串联：AudioManager 通知 → AudioPolicyManager 重路由 →
      A2dpService/HeadsetService 切换 Session → Audio HAL 重新 StartSession。

