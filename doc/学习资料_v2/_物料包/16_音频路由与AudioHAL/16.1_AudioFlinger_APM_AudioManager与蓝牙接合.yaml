  s06_call_chain:
    min_layers: 5
    format: |
      用户操作 / 设备连接事件:
        → AdapterService / A2dpService（设备连接事件）
      ActiveDeviceManager:
        → setA2dpActiveDevice() / setHfpActiveDevice() / setLeAudioActiveDevice()
        → A2dpService.setActiveDevice() / HeadsetService.setActiveDevice()
      A2dpService / HeadsetService:
        → 通知 AudioManager（registerAudioDeviceCallback 回调 / setBluetoothA2dpOn）
      AudioPolicyManager（外部依赖，AOSP system/media）:
        → 重路由音频流，选择最优输出设备
      audio_hal_interface:
        → HalVersionManager.GetHalVersion() 选路
        → bluetooth::audio::a2dp::start_session() / HfpClientInterface::StartSession()
        → BluetoothAudioClientInterface::StartSession()（AIDL 路径）
        → provider_->startSession() → FMQ 建立

